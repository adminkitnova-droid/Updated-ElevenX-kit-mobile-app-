<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="50%" stop-color="#121210" />
      <stop offset="100%" stop-color="#0a0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#c9922e" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#c9922e" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android & iOS -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="4" opacity="0.6" />

  <!-- Shield / Crest outline -->
  <path d="M 256 64 C 360 64 416 80 416 80 C 416 280 256 440 256 440 C 256 440 96 280 96 80 C 96 80 152 64 256 64 Z" 
        fill="#181613" stroke="url(#goldGrad)" stroke-width="6" filter="url(#goldGlow)" />

  <!-- Crown Icon at Top of Shield -->
  <g fill="url(#goldGrad)" transform="translate(156, 110) scale(0.39)">
    <path d="M 100 420 L 412 420 C 424 420 432 410 428 398 L 388 240 L 460 300 C 470 308 485 300 482 288 L 440 80 C 438 70 425 66 418 74 L 280 200 L 262 36 C 260 26 248 26 246 36 L 228 200 L 90 74 C 83 66 70 70 68 80 L 26 288 C 23 300 38 308 48 300 L 120 240 L 80 398 C 76 410 84 420 96 420 Z" />
  </g>

  <!-- Central "11X" Bold Typography -->
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="94" font-weight="900" 
        fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">11X</text>

  <!-- "KIT" Subtitle -->
  <text x="256" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" 
        fill="#fef08a" text-anchor="middle" letter-spacing="10">KIT APP</text>

  <!-- Stars at bottom of crest -->
  <circle cx="216" cy="400" r="5" fill="url(#goldGrad)" />
  <circle cx="256" cy="408" r="7" fill="url(#goldGrad)" />
  <circle cx="296" cy="400" r="5" fill="url(#goldGrad)" />
</svg>
